id = "herdr-spawn"
name = "Spawn"
version = "0.2.1"
min_herdr_version = "0.7.0"
description = "Launch an agent with a prompt — dedicated worktree + workspace by default"
platforms = ["linux", "macos"]

# The launch popup: reads the prompt (history, shift+enter for multi-line,
# :h fzf picker), creates worktree + workspace, starts the agent, submits
# the prompt.
[[panes]]
id = "launcher"
title = "Launch an agent"
placement = "popup"
width = "70%"
height = 14
command = ["bash", "ui.sh"]

# The reaper: lists agent worktrees (merged/empty/changes/live agent),
# fzf multi-select, removes worktree + branch.
[[panes]]
id = "reaper"
title = "Clean up agent worktrees"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "reap.sh"]

# Bindable action (e.g. prefix+enter): opens the launcher popup.
[[actions]]
id = "open"
title = "Open the agent launcher"
contexts = ["global"]
command = ["bash", "open.sh"]

# Bindable action: opens the reaper (spawn done).
[[actions]]
id = "done"
title = "Clean up agent worktrees"
contexts = ["global"]
command = ["bash", "open.sh", "reaper"]
