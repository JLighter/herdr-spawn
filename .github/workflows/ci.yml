name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x *.sh

  tests:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and expect
        run: sudo apt-get update -q && sudo apt-get install -y -q bats expect
      - name: Run tests
        run: bats tests/
